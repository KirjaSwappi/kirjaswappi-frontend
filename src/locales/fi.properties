supportUs.sectionDescription1 = Taloudellinen panoksesi tukee suoraan ohjelmiamme ja palveluitamme auttaen meitä tavoittamaan enemmän henkilöitä ja perheitä. Jokainen lahjoitus, riippumatta koosta, tekee merkittävän vaikutuksen.
supportUs.sectionDescription2 = Tee yhteistyötä kanssamme vahvistaaksemme vaikutustamme ja tavoittaaksemme laajemman yleisön. Otamme mielellämme vastaan kumppanuuksia yritysten, organisaatioiden ja yksilöiden kanssa, jotka jakavat sitoutumisemme yhteisön tukemiseen.
supportUs.sectionDescription3 = Liity mukanamme tekemään ero lahjoittamalla aikaasi ja taitojasi. Vapaaehtoiset ovat keskeisessä roolissa ohjelmiemme tukemisessa ja yhteisöllisen ulottuvuutemme laajentamisessa. Osallistumisellasi on merkitystä.
