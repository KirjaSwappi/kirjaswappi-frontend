# Section 3
privacypolicy.section.point3.1.1=Muuille käyttäjille: Nimesi, postiosoitteesi ja yhteystietosi voidaan jakaa muille käyttäjille kirjavaihtojen helpottamiseksi.
privacypolicy.section.point3.1.2=Palveluntarjoajien kanssa: Saatamme jakaa tietoja kolmannen osapuolen palveluntarjoajien kanssa, jotka auttavat meitä verkkosivuston ylläpidossa (esim. maksunvälittäjät, isännöintipalveluntarjoajat).
privacypolicy.section.point3.1.3=Oikeudellisista syistä: Saatamme paljastaa tietojasi, jos laki niin edellyttää tai jos haluamme suojella oikeuksiamme, omaisuuttamme tai turvallisuuttamme.
privacypolicy.section.point3.1.4=Suostumuksellasi: Saatamme jakaa tietojasi kolmansille osapuolille, jos annat meille nimenomaisen luvan tehdä niin.



# Section 4
