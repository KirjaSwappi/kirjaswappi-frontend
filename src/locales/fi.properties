privacypolicy.section.title9=Jos käytät verkkosivustoa Suomen ulkopuolelta, huomaa, että tietojasi voidaan siirtää, tallentaa ja käsitellä Suomessa, missä palvelimemme sijaitsevat. Käyttämällä verkkosivustoa hyväksyt tämän siirron ja käsittelyn.
privacypolicy.section.title10=Voimme päivittää tätä tietosuojakäytäntöä ajoittain. Kaikki muutokset julkaistaan tällä sivulla päivitetyn "Päivitetty viimeksi" -päivämäärän kanssa. Kehotamme tarkistamaan tätä käytäntöä säännöllisesti pysyäksesi ajan tasalla siitä, miten suojaamme tietojasi.
