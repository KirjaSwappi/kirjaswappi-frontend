privacypolicy.subtitle=Hallinnoi tietojasi ja käyttöoikeuksiasi tietosuojasi hallitsemiseksi. Sinulla on oikeus käyttää, muokata tai poistaa tietojasi milloin tahansa.
privacypolicy.introduction=Olemme sitoutuneet suojaamaan yksityisyyttäsi ja varmistamaan, että henkilökohtaisia tietojasi käsitellään turvallisesti ja vastuullisesti. Tämä tietosuojakäytäntö kuvaa, miten keräämme, käytämme, säilytämme ja suojaamme tietojasi, kun käytät verkkosivustoamme. Käyttämällä KirjaSwappia hyväksyt tämän tietosuojakäytännön ehdot. Jos et hyväksy jotakin osaa tästä käytännöstä, älä käytä verkkosivustoamme.
