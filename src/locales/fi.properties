privacypolicy.section.point4.1.3=Henkilökohtaisten tietojen käyttöoikeuden rajoittaminen vain valtuutetulle henkilökunnalle.


# Section 8
privacypolicy.section.point8.1.1=<strong>Käyttöoikeus:</strong> Voit pyytää kopion henkilökohtaisista tiedoistamme sinusta.
privacypolicy.section.point8.1.2=<strong>Korjaus:</strong> Voit päivittää tai korjata henkilökohtaisia tietojasi tiliasetustesi kautta tai ottamalla yhteyttä meihin.
privacypolicy.section.point8.1.3=<strong>Poistaminen:</strong> Voit pyytää meitä poistamaan henkilökohtaiset tietosi tietyistä laillisista velvoitteista huolimatta.
privacypolicy.section.point8.1.4=<strong>Poistuminen:</strong> Voit poistua mainosviestien vastaanottajilta seuraamalla sähköpostin peruutuslinkkiä.



# sections - paragraphs
privacypolicy.section.paragraph4=Internetin välityksellä tapahtuva siirto tai elektroninen tallennus ei kuitenkaan ole 100% turvallista. Vaikka pyrimme suojaamaan tietosi, emme voi taata täydellistä turvallisuutta.

privacypolicy.section.paragraph5=Evästeet ovat pieniä tiedostoja laitteellasi, jotka auttavat meitä muistamaan asetuksesi ja seuraamaan käyttötottumuksiasi. Voit poistaa evästeet käytöstä selaimesi asetuksissa, mutta tämä voi vaikuttaa verkkosivuston toimintaan.

privacypolicy.section.paragraph8=Näiden oikeuksien käyttämiseksi ota yhteyttä meihin osoitteeseen <strong>info@kirjaswappi.fi.</strong>

privacypolicy.section.paragraph11=<strong>www.Kirjaswappi.fi</strong> <br /> <span>Sähköposti: info@kirjaswappi.fi</span> <br /> <span>Postiosoite: Emännäntie 10K 25</span> <br /> <span>Puhelin: +358408536161</span>


