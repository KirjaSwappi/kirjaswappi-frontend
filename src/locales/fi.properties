termsofservice.section.title4=KirjaSwappi helpottaa kirjojen vaihtoa käyttäjien välillä. Huomaa:
termsofservice.section.point4.1.1=KirjaSwappi ei ole vaihtotapahtuman osapuoli eikä vastaa vaihdettujen kirjojen kunnosta, laadusta tai toimituksesta.
termsofservice.section.point4.1.2=Käyttäjät ovat yksin vastuussa vaihtosopimusten täyttämisestä.
termsofservice.section.point4.1.3=Listattujen kirjojen on oltava tarkasti kuvattuja. Virheellinen kuvaus voi johtaa tilin keskeyttämiseen.

termsofservice.section.category5=Immateriaalioikeudet
termsofservice.section.mobilecategory5=Immateriaalioikeudet
termsofservice.section.title5=Kaikki KirjaSwappin sisältö, mukaan lukien logot, teksti, grafiikat ja ohjelmistot, on KirjaSwappin tai sen lisenssinantajien omaisuutta ja suojattu sovellettavilla immateriaalioikeuslaeilla. Et saa kopioida, levittää tai luoda johdannaisia teoksia ilman etukäteen saatua kirjallista lupaa.

termsofservice.section.category6=Vastuunrajoitus
termsofservice.section.mobilecategory6=Vastuunrajoitus
termsofservice.section.title6=KirjaSwappi tarjotaan "sellaisenaan" ilman minkäänlaisia takuita. Lain sallimassa laajimmassa laajuudessa KirjaSwappi ei ole vastuussa mistään epäsuorista, satunnaisista, erityisistä tai välillisistä vahingoista, jotka aiheutuvat alustan käytöstä.

