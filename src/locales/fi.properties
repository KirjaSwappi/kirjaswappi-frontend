termsofservice.section.title3=Sitoudut käyttämään KirjaSwappia vain laillisiin tarkoituksiin. Et saa:
termsofservice.section.point3.1.1=Julkaista harhaanjohtavaa, petollista tai loukkaavaa sisältöä.
