privacypolicy.section.title5=Käytämme evästeitä ja vastaavia seurantatekniikoita parantaaksemme kokemustasi verkkosivustollamme.
privacypolicy.section.title6=Verkkosivustomme voi sisältää linkkejä kolmannen osapuolen verkkosivuille. Emme ole vastuussa näiden verkkosivustojen tietosuojakäytännöistä tai sisällöstä. Kehotamme tarkistamaan minkä tahansa vierailemasi kolmannen osapuolen sivuston tietosuojakäytännöt.
privacypolicy.section.title7=Verkkosivustomme ei ole tarkoitettu alle 7-vuotiaiden henkilöiden käyttöön. Emme tietoisesti kerää henkilökohtaisia tietoja alle 7-vuotiailta lapsilta. Jos havaitsemme, että olemme keränneet tällaisia tietoja, ryhdymme toimenpiteisiin niiden poistamiseksi.
