# Section 3
privacypolicy.section.point3.1.1=Med andra användare: Ditt namn, postadress och kontaktinformation kan delas med andra användare för att underlätta bokbyten.
privacypolicy.section.point3.1.2=Med tjänsteleverantörer: Vi kan dela information med tredjepartstjänsteleverantörer som hjälper oss att driva webbplatsen (t.ex. betalningsprocessorer, värdleverantörer).
privacypolicy.section.point3.1.3=För juridiska skäl: Vi kan avslöja din information om det krävs enligt lag eller för att skydda våra rättigheter, egendom eller säkerhet.
privacypolicy.section.point3.1.4=Med ditt samtycke: Vi kan dela din information med tredje part om du ger oss uttryckligt tillstånd att göra det.



# Section 4
privacypolicy.section.point4.1.1=Användning av kryptering för känsliga data (t.ex. betalningsinformation).
privacypolicy.section.point4.1.2=Regelbunden uppdatering av våra säkerhetsrutiner.
privacypolicy.section.point4.1.3=Begränsning av tillgång till personlig information till endast behörig personal.


# Section 8
privacypolicy.section.point8.1.1=<strong>Åtkomst:</strong> Du kan begära en kopia av den personliga information vi har om dig.
privacypolicy.section.point8.1.2=<strong>Korrigering:</strong> Du kan uppdatera eller korrigera din personliga information via dina kontoinställningar eller genom att kontakta oss.
privacypolicy.section.point8.1.3=<strong>Radering:</strong> Du kan begära att vi raderar din personliga information, med vissa undantag enligt lag.
privacypolicy.section.point8.1.4=<strong>Avsluta prenumeration:</strong> Du kan avsluta prenumerationen på reklammejl genom att följa avsluta-länken i mejlet.



# sections - paragraphs
privacypolicy.section.paragraph4=Ingen metod för överföring över internet eller elektronisk lagring är dock 100% säker. Även om vi strävar efter att skydda din information kan vi inte garantera absolut säkerhet.

privacypolicy.section.paragraph5=Cookies är små filer som lagras på din enhet och som hjälper oss att komma ihåg dina inställningar och spåra användningsmönster. Du kan inaktivera cookies via dina webbläsarinställningar, men detta kan påverka webbplatsens funktionalitet.

privacypolicy.section.paragraph8=För att utöva dessa rättigheter, vänligen kontakta oss på <strong>info@kirjaswappi.fi.</strong>

