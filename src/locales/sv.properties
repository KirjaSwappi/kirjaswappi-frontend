termsofservice.section.point2.1.3=Alla aktiviteter som sker under ditt konto.

termsofservice.section.category3=Acceptabel användning
termsofservice.section.mobilecategory3=Acceptabel användning
termsofservice.section.title3=Du godkänner att använda KirjaSwappi enbart för lagliga ändamål. Du får inte:
