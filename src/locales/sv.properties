# Section 8
privacypolicy.section.point8.1.1=<strong>Åtkomst:</strong> Du kan begära en kopia av den personliga information vi har om dig.
privacypolicy.section.point8.1.2=<strong>Korrigering:</strong> Du kan uppdatera eller korrigera din personliga information via dina kontoinställningar eller genom att kontakta oss.
privacypolicy.section.point8.1.3=<strong>Radering:</strong> Du kan begära att vi raderar din personliga information, med vissa undantag enligt lag.
privacypolicy.section.point8.1.4=<strong>Avsluta prenumeration:</strong> Du kan avsluta prenumerationen på reklammejl genom att följa avsluta-länken i mejlet.



