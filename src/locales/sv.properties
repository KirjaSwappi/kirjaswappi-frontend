termsofservice.header=Användarvillkor
termsofservice.lastupdated=Senast uppdaterad
termsofservice.intro=Välkommen till KirjaSwappi. Genom att använda vår webbplats och våra tjänster godkänner du dessa användarvillkor. Läs dem noggrant innan du använder plattformen.
