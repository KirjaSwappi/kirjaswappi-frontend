# sections - titles
privacypolicy.section.title1=Vi kan samla in följande typer av information:
privacypolicy.section.title2=Vi använder den information vi samlar in för följande ändamål:
privacypolicy.section.title3=Vi säljer, byter eller hyr inte ut din personliga information till tredje part. Vi kan dock dela din information under följande omständigheter:
privacypolicy.section.title4=Vi vidtar rimliga åtgärder för att skydda din personliga information från obehörig åtkomst, användning eller utsläpp. Dessa åtgärder inkluderar
privacypolicy.section.title5=Vi använder cookies och liknande spårningstekniker för att förbättra din upplevelse på vår webbplats.
privacypolicy.section.title6=Vår webbplats kan innehålla länkar till webbplatser från tredje part. Vi är inte ansvariga för integritetspraxis eller innehåll på dessa webbplatser. Vi uppmuntrar dig att granska integritetspolicyn för alla webbplatser från tredje part du besöker.
privacypolicy.section.title7=Vår webbplats är inte avsedd för användning av personer under 7 års ålder. Vi samlar inte medvetet in personlig information från barn under 7 år. Om vi får veta att vi har samlat in sådan information kommer vi att vidta åtgärder för att radera den.
privacypolicy.section.title8=Du har följande rättigheter gällande din personliga information:
privacypolicy.section.title9=Om du använder webbplatsen från utanför Finland, notera att din information kan överföras, lagras och behandlas i Finland, där våra servrar är belägna. Genom att använda webbplatsen samtycker du till denna överföring och behandling.
privacypolicy.section.title10=Vi kan uppdatera denna integritetspolicy från tid till annan. Alla ändringar kommer att publiceras på denna sida med ett uppdaterat "Senast uppdaterad"-datum. Vi uppmuntrar dig att granska denna policy regelbundet för att hålla dig informerad om hur vi skyddar din information.
privacypolicy.section.title11=Om du har några frågor eller funderingar om denna integritetspolicy eller vår databehandling, vänligen kontakta oss på:



