privacypolicy.section.point3.1.1=Med andra användare: Ditt namn, postadress och kontaktinformation kan delas med andra användare för att underlätta bokbyten.
privacypolicy.section.point3.1.2=Med tjänsteleverantörer: Vi kan dela information med tredjepartstjänsteleverantörer som hjälper oss att driva webbplatsen (t.ex. betalningsprocessorer, värdleverantörer).
privacypolicy.section.point3.1.3=För juridiska skäl: Vi kan avslöja din information om det krävs enligt lag eller för att skydda våra rättigheter, egendom eller säkerhet.
