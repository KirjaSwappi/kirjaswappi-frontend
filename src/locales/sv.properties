termsofservice.section.point3.1.2=Trakassera, hota eller misshandla andra användare.
termsofservice.section.point3.1.3=Försöka få obehörig åtkomst till plattformen eller andra användares konton.
termsofservice.section.point3.1.4=Använda plattformen för kommersiella ändamål utan föregående skriftligt medgivande.

termsofservice.section.category4=Bokbyten
termsofservice.section.mobilecategory4=Bokbyten
termsofservice.section.title4=KirjaSwappi underlättar bokbyten mellan användare. Observera:
termsofservice.section.point4.1.1=KirjaSwappi är inte part i någon bytestransaktion och bär inget ansvar för skick, kvalitet eller leverans av utbytta böcker.
termsofservice.section.point4.1.2=Användare är ensamt ansvariga för att uppfylla sina bytesavtal.
termsofservice.section.point4.1.3=Böcker som listas måste beskrivas korrekt. Felaktig beskrivning kan resultera i kontosuspension.

termsofservice.section.category5=Immateriella rättigheter
termsofservice.section.mobilecategory5=Immateriella rättigheter
