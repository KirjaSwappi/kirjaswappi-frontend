version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'Build(deps)'
    labels:
      - dependencies
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - '@types/react*'
      redux:
        patterns:
          - '@reduxjs/*'
          - 'react-redux'
      lint:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'Build(deps)'
    labels:
      - dependencies
